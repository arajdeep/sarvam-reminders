<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Reminders</title>
<meta name="description" content="Voice-first reminders for medicines, meals, bills and appointments in English and all 22 scheduled Indian languages. Built on Sarvam AI.">
<meta property="og:title" content="Sarvam Reminders">
<meta property="og:description" content="Speak a reminder in your language. Medicines, meals, bills and appointments, with spoken alerts and family check-ins.">
<meta property="og:type" content="website">
<meta name="theme-color" content="#16794a">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='16' fill='%2316794a'/%3E%3Cpath d='M32 14a12 12 0 0 0-12 12v8l-4 6v2h32v-2l-4-6v-8a12 12 0 0 0-12-12zm-5 32a5 5 0 0 0 10 0z' fill='white'/%3E%3C/svg%3E">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<main>

  <!-- ============ First run: language → who it's for ============ -->
  <section id="onboard" class="onboard" hidden>
    <div class="brand">
      <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
      <strong style="font-size:1.1rem">Sarvam Reminders</strong>
    </div>

    <div id="stepLang" class="card">
      <div class="step">1 / 2</div>
      <h1>Choose your language · अपनी भाषा चुनें</h1>
      <div id="langGrid" class="lang-grid"></div>
    </div>

    <div id="stepMode" class="card" hidden>
      <div class="step">2 / 2</div>
      <h1 data-t="who_for"></h1>
      <div id="modeList" style="margin-top:16px"></div>
      <button id="modeBack" class="ghost" data-t="back"></button>
    </div>

    <div id="stepKey" class="card" hidden>
      <h1 data-t="key_title"></h1>
      <p class="hint" data-t="key_hint"></p>
      <input id="obKey" type="password" autocomplete="off" data-tp="key_placeholder" style="margin-top:14px">
      <div class="row" style="margin-top:12px">
        <button id="obKeySave" class="fit" data-t="save"></button>
        <button id="obKeyLater" class="fit secondary" data-t="later"></button>
      </div>
    </div>
  </section>

  <!-- ============ Main app ============ -->
  <section id="app" hidden>
    <header class="header">
      <div class="brand">
        <div class="logo" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 9-3 9h18s-3-2-3-9"/><path d="M13.7 21a2 2 0 0 1-3.4 0"/></svg></div>
        <div>
          <h1 data-t="app_title"></h1>
          <p class="hint" data-t="tagline" style="margin:0"></p>
        </div>
      </div>
      <div class="chips">
        <button id="langBtn" class="chip"></button>
        <button id="modeBtn" class="chip"></button>
      </div>
    </header>

    <!-- Speak or type -->
    <section class="card" aria-labelledby="micLabel">
      <button id="mic" class="mic" data-t="speak"></button>
      <div class="row" style="margin-top:12px">
        <input id="typed" data-tp="type_placeholder" aria-label="Reminder">
        <button id="addBtn" class="fit secondary" data-t="add"></button>
      </div>
      <div id="status" role="status" aria-live="polite"></div>

      <div id="draft" hidden>
        <div class="row">
          <div><label class="f" for="dPerson" data-t="f_for"></label><select id="dPerson"></select></div>
          <div><label class="f" for="dTitle" data-t="f_title"></label><input id="dTitle"></div>
        </div>
        <div class="row" style="margin-top:10px">
          <div><label class="f" for="dKind" data-t="f_kind"></label><select id="dKind">
            <option value="schedule" data-t="kind_schedule"></option><option value="bill" data-t="kind_date"></option></select></div>
          <div><label class="f" for="dCategory" data-t="f_category"></label><select id="dCategory">
            <option value="medicine" data-t="cat_medicine"></option><option value="meal" data-t="cat_meal"></option>
            <option value="bill" data-t="cat_bill"></option><option value="payment" data-t="cat_payment"></option>
            <option value="appointment" data-t="cat_appointment"></option><option value="other" data-t="cat_other"></option></select></div>
        </div>
        <div class="row" style="margin-top:10px" id="scheduleFields">
          <div><label class="f" for="dTimes" data-t="f_times"></label><input id="dTimes" placeholder="08:00, 21:00" inputmode="numeric"></div>
          <div><label class="f" for="dFood" data-t="f_food"></label><select id="dFood">
            <option value="any" data-t="food_any"></option><option value="before" data-t="food_before"></option>
            <option value="after" data-t="food_after"></option><option value="with" data-t="food_with"></option></select></div>
        </div>
        <div class="row" style="margin-top:10px" id="billFields" hidden>
          <div><label class="f" for="dDue" data-t="f_due"></label><input id="dDue" type="date"></div>
          <div><label class="f" for="dRepeat" data-t="f_repeat"></label><select id="dRepeat">
            <option value="none" data-t="repeat_none"></option><option value="monthly" data-t="repeat_monthly"></option></select></div>
          <div><label class="f" for="dAmount" data-t="f_amount"></label><input id="dAmount" type="number" min="0" inputmode="decimal"></div>
        </div>
        <div class="row" style="margin-top:14px">
          <button id="saveDraft" class="fit" data-t="save_reminder"></button>
          <button id="cancelDraft" class="fit ghost" data-t="cancel"></button>
        </div>
      </div>
    </section>

    <!-- Today -->
    <section class="card">
      <div class="card-head">
        <h2><span class="ic" aria-hidden="true">📅</span><span data-t="today"></span></h2>
        <button id="summaryBtn" class="secondary" data-t="summary_btn"></button>
      </div>
      <div id="today"></div>
      <div id="streaks"></div>
    </section>

    <!-- Check-in -->
    <section class="card">
      <div class="card-head"><h2><span class="ic" aria-hidden="true">💬</span><span data-t="checkin_title"></span></h2></div>
      <div id="checkins"></div>
    </section>

    <section class="card" id="boardCard" hidden>
      <div class="card-head"><h2><span class="ic" aria-hidden="true">📋</span><span data-t="board_title"></span></h2></div>
      <div id="board"></div>
    </section>

    <section class="card" id="alertsCard" hidden>
      <div class="card-head"><h2><span class="ic" aria-hidden="true">🔔</span><span data-t="alerts_title"></span></h2></div>
      <div id="alerts"></div>
    </section>

    <!-- Quick add -->
    <section class="card">
      <div class="card-head" style="margin-bottom:4px"><h2><span class="ic" aria-hidden="true">⚡</span><span data-t="quick_title"></span></h2></div>
      <p class="hint" data-t="quick_hint" style="margin-bottom:12px"></p>
      <select id="tPerson" style="margin-bottom:12px"></select>
      <div id="templates" class="chips"></div>
    </section>

    <!-- Settings -->
    <details class="card" id="moreCard">
      <summary><span data-t="more"></span></summary>

      <div>
        <h2 style="margin-bottom:10px" data-t="people_title"></h2>
        <div id="people"></div>
        <div id="addMember" class="row" style="margin-top:10px" hidden>
          <input id="mName" data-tp="name_placeholder">
          <select id="mProfile" class="fit" style="width:auto">
            <option value="elder" data-t="prof_elder"></option><option value="adult" data-t="prof_adult"></option>
            <option value="child" data-t="prof_child"></option><option value="baby" data-t="prof_baby"></option></select>
          <button id="mAdd" class="fit secondary" data-t="add_member"></button>
        </div>
        <div id="addCaregiver" class="row" style="margin-top:10px" hidden>
          <input id="cgName" data-tp="name_placeholder">
          <button id="cgAdd" class="fit secondary"></button>
        </div>
        <div id="syncNote" class="note" style="margin-top:12px" hidden></div>
      </div>

      <div class="sub">
        <h2 style="margin-bottom:10px" data-t="all_title"></h2>
        <div id="all"></div>
      </div>

      <div class="sub">
        <h2 data-t="key_title"></h2>
        <p class="hint" data-t="key_hint" style="margin-bottom:10px"></p>
        <div class="row">
          <input id="keyInput" type="password" autocomplete="off" data-tp="key_placeholder">
          <button id="saveKey" class="fit" data-t="save"></button>
        </div>
      </div>

      <div class="sub">
        <h2 data-t="backup_title"></h2>
        <p class="hint" data-t="backup_hint" style="margin-bottom:10px"></p>
        <div class="row">
          <button id="exportBtn" class="fit secondary" data-t="download"></button>
          <label class="btn secondary fit"><span data-t="restore"></span><input id="importFile" type="file" accept="application/json" hidden></label>
        </div>
      </div>
    </details>

    <footer>
      <span data-t="footer"></span><br>
      <a href="https://github.com/arajdeep/sarvam-reminders" target="_blank" rel="noopener">GitHub</a>
    </footer>
  </section>
</main>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="logic.js"></script>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
